name: chess4f
services:
  api:
    image: chess4f:local
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      CHESS4F_DATA: /data
    volumes: ["./data:/data"]
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  dashboard:
    image: chess4f:local
    build: .
    command: ["streamlit", "run", "apps/dashboard.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true", "--browser.gatherUsageStats=false"]
    ports: ["127.0.0.1:8501:8501"]
    environment:
      CHESS4F_API: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 1g
    cpus: 1
  pipeline:
    image: chess4f:local
    profiles: ["jobs"]
    build: .
    entrypoint: ["chess4f"]
    command: ["status"]
    environment:
      CHESS4F_DATA: /data
    volumes: ["./data:/data"]
    mem_limit: 4g
    cpus: 2
